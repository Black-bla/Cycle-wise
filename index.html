<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyclewise | AI SME Exchange Coordinator</title>
    <meta name="description" content="Cyclewise helps small businesses exchange stock, services and capacity through safe multi-business matches." />
    <meta property="og:title" content="Cyclewise | AI SME Exchange Coordinator" />
    <meta property="og:description" content="Cyclewise helps small businesses exchange stock, services and capacity through safe multi-business matches." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cyclewise-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved = theme === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : theme;
          document.documentElement.classList.add(resolved);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
